name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to set up"
        type: string
        required: true
      install-command:
        description: "Command to install dependencies"
        type: string
        required: true
      lint-command:
        description: "Command to run linting"
        type: string
        required: true
      test-command:
        description: "Command to run tests"
        type: string
        required: true
      audit-command:
        description: "Command to run a dependency audit (optional; skipped if omitted)"
        type: string
        required: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: ${{ inputs.install-command }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Lint
        run: ${{ inputs.lint-command }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Test
        run: ${{ inputs.test-command }}

  audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Audit
        if: ${{ inputs.audit-command != '' }}
        run: ${{ inputs.audit-command }}
